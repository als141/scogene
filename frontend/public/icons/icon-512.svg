<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="120" fill="#4338ca"/>

  <!-- Decorative gradient overlay -->
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#accentGradient)"/>

  <!-- Decorative accent elements -->
  <circle cx="420" cy="420" r="70" fill="#ffffff" opacity="0.12"/>
  <circle cx="100" cy="80" r="40" fill="#ffffff" opacity="0.08"/>

  <!-- Main "S" letter -->
  <g transform="translate(256, 256)">
    <!-- Stylized S shape with better proportions -->
    <path d="M -45 -75 Q -70 -75 -70 -45 Q -70 -20 -45 -10 Q 0 5 45 15 Q 70 25 70 45 Q 70 75 45 75 Q 15 75 -5 60"
          fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pen/Checkmark element overlay -->
  <g transform="translate(256, 256)">
    <!-- Checkmark integrated with pen design -->
    <g transform="translate(55, -15)">
      <!-- Pen nib (stylized) -->
      <path d="M 0 0 L 20 35 L -5 40 Z" fill="#ffffff"/>
      <!-- Checkmark tick -->
      <path d="M 20 35 L 45 10 L 55 25" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
